# Workflow to test the ServerConfig class
name: Testbed - ServerConfig
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
    - '.github/workflows/TEST_ServerConfig.yml'
    - '.github/actions/test_config/**'
    - 'tests/cases/configs/ServerConfigSuite/**'
    - 'tests/config/**'
    - '!.github/workflows/CI_APIUtils.yml'
    - '!.github/workflows/BUILD_APIUtils.yml'
    - '!.github/actions/**'
    - '!requirements.txt'
    - '!src/**'
    - '!tests/utils/**'

jobs:

  run_testbed_server_config:
    name: Run ServerConfig Testbed
    runs-on: ubuntu-24.04
    container: python:${{ vars.OGD_PYTHON_VERSION }}-alpine
    defaults:
      run:
        shell: sh
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-ServerConfig
      cancel-in-progress: true

    steps:
  # 1. Local checkout 
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
    - name: Get Dependencies
      run: python -m pip install -r requirements.txt
    - name: Set up Config File
      uses: ./.github/actions/test_config
      with:
          verbose_output:     "True"
          shell: sh

  # 2. Build & configure remote environments

  # 3. Perform export
    - name: Execute testbed
      run: python -m unittest discover -s tests/cases/configs -p "*Case.py" -t ./

  # 4. Cleanup & complete
    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "test-log"
        path: ./*.log
