# Workflow to build and release a new version of the APIUtils onto pypi.
name: Release Script - APIUtils
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'release' && github.ref || 'Manual Run') }}
on:
  workflow_dispatch:
  release:
    types: [prereleased, released]

jobs:

  testbed_server_config:
    name: ServerConfig Testbed
    uses: ./.github/workflows/TEST_ServerConfig.yml

  testbed_api_response:
    name: APIResponse Testbed
    uses: ./.github/workflows/TEST_APIResponse.yml

  testbed_api_utils:
    name: APIUtils Testbed
    uses: ./.github/workflows/TEST_APIUtils.yml

  testbed_hello_local:
    name: HelloAPI Testbed
    uses: ./.github/workflows/TEST_resources_local.yml

  build:
    name: Build Python Package
    needs: [testbed_server_config, testbed_api_response, testbed_api_utils, testbed_hello_local]
    uses: ./.github/workflows/BUILD_APIUtils.yml
    with:
      image_name:   ${{ github.repository }} # github.repository includes organization as prefix
      image_tag:    ${{ github.ref_name }}
      with_caching: true
    secrets:
      image_repository: ${{ secrets.DOCKER_IMAGE_REPO }}

  release:
    name: Publish Release to PyPI
    needs: [build]
    if: github.event.action == 'released'
    runs-on: ubuntu-24.04
    environment:
      name: pypi_release
      url: https://pypi.org/manage/project/opengamedata-api-utils/
    permissions:
      id-token: write
    steps:

    # 1. Local checkout & config
    - name: Restore Cached Build
      id: cached-build
      uses: actions/cache/restore@v6.1.0
      with:
        key: opengamedata-api-utils-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ./dist/
        fail-on-cache-miss: true
    - name: Fail if Cache Restore Failed
      if: steps.cached-build.outputs.cache-hit == 'false'
      run: exit 1
    # 2. Build 

    # 3. Remote config & deploy
    - name: Publish to PyPI
      if: steps.cached-build.outputs.cache-hit == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true

    # 4. Cleanup & complete

  prerelease:
    name: Publish Prerelease to PyPI
    needs: [build]
    if: github.event.action == 'prereleased'
    runs-on: ubuntu-24.04
    environment:
      name: pypi_prerelease
      url: https://pypi.org/manage/project/opengamedata-api-utils/
    permissions:
      id-token: write
    steps:

    # 1. Local checkout & config
    - name: Restore Cached Build
      id: cached-build
      uses: actions/cache/restore@v6.1.0
      with:
        key: opengamedata-api-utils-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ./dist/
        fail-on-cache-miss: true
    - name: Fail if Cache Restore Failed
      if: steps.cached-build.outputs.cache-hit == 'false'
      run: exit 1

    # 2. Build 

    # 3. Remote config & deploy
    - name: Publish to PyPI
      if: steps.cached-build.outputs.cache-hit == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        repository-url: https://test.pypi.org/legacy/

    # 4. Cleanup & complete

  wait_for_pypi:
    name: Wait for PyPI to Update
    needs: [build, release]
    environment: release-wait-deploy # use environment to force waiting a few minutes after the PyPI release.
    runs-on: ubuntu-24.04
    steps:
    - name: Done Waiting
      run: echo "Done waiting."
      shell: bash

  deploy:
    name: Release Deploy
    if: github.event.action == 'released'
    needs: [build, release, wait_for_pypi]
    uses: ./.github/workflows/DEPLOY_FileAPI.yml
    with:
      image_name:       ${{ github.repository }} # github.repository includes organization as prefix
      image_tag:        ${{ github.ref_name }}
      as_latest: true
      remove: false
    secrets: inherit

  testbed_hello_remote:
    name: HelloAPI Remote Testbed
    needs: deploy_helloapi
    uses: ./.github/workflows/TEST_resources_remote.yml
