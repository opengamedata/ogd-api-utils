# Workflow to build and release a new version of the APIUtils onto pypi.
name: Release Script - APIUtils
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'release' && github.ref || 'Manual Run') }}
on:
  workflow_dispatch:
  release:
    types: [prereleased, released]

env:
  CACHE_KEY: opengamedata-api-utils-build-${{ github.run_id }}-${{ github.run_attempt }}

jobs:

  # *** 1. Pre-Deploy Testing ***

  testbed_server_config:
    name: ServerConfig Testbed
    uses: ./.github/workflows/TEST_ServerConfig.yml

  testbed_api_response:
    name: APIResponse Testbed
    uses: ./.github/workflows/TEST_APIResponse.yml

  testbed_api_utils:
    name: APIUtils Testbed
    uses: ./.github/workflows/TEST_APIUtils.yml

  testbed_hello_local:
    name: HelloAPI Local Testbed
    uses: ./.github/workflows/TEST_resources_local.yml

  # *** 2. Package and Publish ***

  package:
    name: Build Python Package
    needs: [testbed_server_config, testbed_api_response, testbed_api_utils, testbed_hello_local]
    uses: ./.github/workflows/PACKAGE_APIUtils.yml
    with:
      with_caching: true
      cache_to: &package opengamedata-api-utils-build-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: Publish Python Package
    needs: [package]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ case(github.event.action == 'released', 'pypi_release', 'pypi_prerelease') }}
      url: https://pypi.org/manage/project/opengamedata-api-utils/
    permissions:
      id-token: write
    steps:

    - name: Restore Cached Build
      id: cached-build
      uses: actions/download-artifact@v7.0.0
      with:
        name: *package
        path: ./dist/

    # 3. Remote config & deploy
    - name: Publish Prerelease to PyPI
      if: github.event.action == 'prereleased'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        repository-url: https://test.pypi.org/legacy/

    - name: Publish Release to PyPI
      if: github.event.action == 'released'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true

  wait_for_pypi:
    name: Wait for PyPI to Update
    needs: [publish]
    environment: release-wait-deploy # use environment to force waiting a few minutes after the PyPI release.
    runs-on: ubuntu-24.04
    steps:
    - name: Done Waiting
      run: echo "Done waiting."
      shell: bash

  # *** 3. Deploy to GCP ***

  build:
    name: Build Docker Image for Test Deploy
    needs: [wait_for_pypi]
    uses: ./.github/workflows/BUILD_APIUtils.yml
    with:
      image_tag:  ${{ github.ref_name }}
    secrets:
      image_repository: ${{ secrets.DOCKER_IMAGE_REPO }}

    # *** Prerelease Case ***

  get_branch:
    name: Get Branch
    if: github.event.action == 'prereleased'
    needs: [build]
    runs-on: ubuntu-24.04
    outputs:
      branch_tag: ${{ steps.get-branch.outputs.branch-name }}
    steps:
    - name: Get Branch
      id: get-branch
      uses: opengamedata/actions-get-branch@v1.1
      with:
        n: 20
        remove: '\.'

  deploy:
    name: Deploy Release for Testing
    needs: [build, get_branch]
    uses: ./.github/workflows/DEPLOY_APIUtils.yml
    with:
      image_name:   ${{ needs.build.outputs.image_name }}
      revision_tag: ${{ case(github.event.action == 'released', 'latest', needs.get_branch.outputs.branch_tag) }}
      remove:       false
    secrets: inherit

    # *** Release Case ***

  # *** 4. Remote Testbeds ***

  testbed_hello_remote:
    name: HelloAPI Remote Testbed
    needs: [deploy]
    uses: ./.github/workflows/TEST_resources_remote.yml
    with:
      base_url: ${{ needs.deploy.outputs.url }}
